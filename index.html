  *{box-sizing:border-box;margin:0;padding:0}

  .wrap{max-width:940px;margin:0 auto;padding:0 20px 80px}

  /* header */
  header{padding:40px 0 0}
  .eyebrow{font-size:11px;letter-spacing:2.5px;color:var(--red);font-weight:600}
  h1{font-size:clamp(24px,5vw,36px);font-weight:700;letter-spacing:-.5px;margin:10px 0 6px}
  .sub{color:var(--mute);font-size:14px}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;
    border-bottom:2px solid var(--red);padding-bottom:18px;margin-top:18px}

  /* lang toggle */
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-shrink:0}
  .lang button{
    background:none;border:0;color:var(--mute);padding:7px 16px;cursor:pointer;
    font-size:12px;font-weight:600;letter-spacing:.5px;transition:.15s;font-family:inherit;
  }
  .lang button.on{background:var(--red);color:#fff}

  /* countdown */
  .cd{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 4px}
  .cd div{background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:12px 16px;flex:1;min-width:130px}
  .cd b{display:block;font-size:22px;font-weight:700;letter-spacing:-.5px}
  .cd span{font-size:11px;color:var(--mute);letter-spacing:.5px}
  .cd .hot b{color:var(--redsoft)}

  /* tabs */
  nav{display:flex;gap:4px;overflow-x:auto;margin:26px 0 24px;
    border-bottom:1px solid var(--line);scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{
    background:none;border:0;border-bottom:2px solid transparent;color:var(--mute);
    padding:11px 15px;cursor:pointer;font-size:13.5px;font-weight:600;white-space:nowrap;
    transition:.15s;font-family:inherit;
  }
  nav button:hover{color:var(--ink)}
  nav button.on{color:var(--ink);border-bottom-color:var(--red)}

  /* content */
  section{display:none;animation:fade .25s ease}
  section.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  h2{font-size:19px;font-weight:700;margin:34px 0 12px;letter-spacing:-.2px}
  h2:first-child{margin-top:0}
  h3{font-size:14px;font-weight:700;color:var(--mute);margin:22px 0 8px;
    letter-spacing:1px;text-transform:uppercase}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px 20px;margin:12px 0}
  .card.hi{border-color:var(--red)}
  .card.hi::before{content:attr(data-tag);display:block;font-size:10px;letter-spacing:1.5px;
    color:var(--redsoft);font-weight:700;margin-bottom:8px}

  table{width:100%;border-collapse:collapse;font-size:13.5px;margin:12px 0}
  th{text-align:left;color:var(--mute);font-weight:600;font-size:11px;letter-spacing:1px;
    text-transform:uppercase;padding:0 10px 10px 0;border-bottom:1px solid var(--line)}
  td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:0}
  td a{color:var(--blue);text-decoration:none}
  td a:hover{text-decoration:underline}
  .tbl-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl-scroll table{min-width:520px}

  ul{list-style:none;margin:10px 0}
  li{padding-left:18px;position:relative;margin:7px 0;font-size:14px}
  li::before{content:'';position:absolute;left:2px;top:10px;width:5px;height:5px;
    border-radius:50%;background:var(--dim)}
  li.k::before{background:var(--red)}

  .pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.5px;
    padding:3px 9px;border-radius:999px;white-space:nowrap}
  .p-done{background:#E3F5E9;color:#1B7A44}
  .p-go{background:#FCEEDC;color:#9A5A0B}
  .p-wait{background:#EFEEEB;color:var(--mute)}
  .p-hot{background:#FBE4E8;color:var(--redsoft)}

  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}

  .ab{border-left:2px solid var(--line);padding-left:14px;margin:14px 0}
  .ab b{display:block;font-size:14px;margin-bottom:6px}
  .ab .pro,.ab .con{font-size:13px;color:var(--mute);margin:3px 0}
  .ab .pro::before{content:'+ ';color:#1B7A44;font-weight:700}
  .ab .con::before{content:'− ';color:var(--redsoft);font-weight:700}
  .ab.win{border-left-color:var(--red)}

  .note{background:#FDF4F5;border-left:3px solid var(--red);border-radius:0 8px 8px 0;
    padding:14px 16px;margin:14px 0;font-size:13.5px}
  .note b{color:var(--redsoft)}

  figure{margin:16px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  figure svg{width:100%;height:auto;display:block}
  figcaption{color:var(--dim);font-size:11.5px;text-align:center;margin-top:10px}

  footer{margin-top:60px;padding-top:20px;border-top:1px solid var(--line);
    color:var(--dim);font-size:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  @media(max-width:600px){.wrap{padding:0 16px 60px}.card{padding:15px 16px}}
</style>
</head>

`<h2>The event</h2>
<div class="tbl-scroll"><table>
<tr><td style="color:#66666F;width:110px">Event</td><td>SUNNY AFTERDARK — horror theme Halloween party</td></tr>
<tr><td style="color:#66666F">Host</td><td>Sunny × Uncharted Influencer Agency</td></tr>
<tr><td style="color:#66666F">Date</td><td>Fri 30 Oct, 17:00–22:00 · set up from 16:00</td></tr>
<tr><td style="color:#66666F">Place</td><td>Namsanddeul, Itaewon (Yongsan-gu) · 3F booth area</td></tr>
<tr><td style="color:#66666F">Guests</td><td>200 (creators · VIP · general)</td></tr>
<tr><td style="color:#66666F">Floors</td><td>1F reception · 2F DJ/F&amp;B · <b>3F booths</b> · 4F rooftop</td></tr>
</table></div>

<h2>Our theme — WEDNESDAY</h2>
<div class="card">
<p>Gothic academia. Black and white base with dark roses, candles, lace and cobweb.
Plus <b>one forbidden splash of colour</b>.</p>
<ul>
<li class="k">Our colour is <b>red</b> — camellia flower + game cups</li>
<li>Use red in 3 places only: cups / camellia / one logo</li>
<li>Table cloth, back wall and costumes stay black and ivory</li>
</ul>
</div>

<div class="note"><b>Must have</b> — the booth needs a game or activity.
Guests vote for the best booth, so decor quality drives our exposure.</div>

<h2>Host provides vs we bring</h2>
<div class="grid2">
<div class="card"><h3 style="margin-top:0">Host provides</h3>
<ul><li>Booth space and spot</li><li>Food and drinks</li><li>Photo booth and photo wall</li><li>DJ and dance floor</li><li>Photographer and videographer</li></ul></div>
<div class="card"><h3 style="margin-top:0">We bring</h3>
<ul><li>Theme decor (dry + rain plan)</li><li>Staff costumes</li><li>Samples + 200 sweets</li><li>Brand signage</li><li>Screen and game props</li></ul></div>
</div>

<div class="note"><b>Rain plan</b> — the host tells us by 12:00 the day before.
Booths move inside, so our decor must work in <b>both layouts</b>.</div>`,

`<h2>Layout</h2>
<p style="color:#66666F;font-size:14px">We use the 3m side as the front. A 2m front is too narrow for 200 guests.</p>
<figure>__SVG__<figcaption>Plan and elevation (not exact scale)</figcaption></figure>

<div class="note"><b>Ask the host</b> which side is the front, before the 18 Sep concept deadline.</div>

<h2>Sizes</h2>
<div class="tbl-scroll"><table>
<tr><th>Item</th><th>Size</th><th>Note</th></tr>
<tr><td><b>Back wall width</b></td><td>3.0m (min 2.4m)</td><td>Full front width</td></tr>
<tr><td><b>Back wall height</b></td><td>2.5m (min 2.2m)</td><td>Stops bean bags flying over</td></tr>
<tr><td><b>Main table</b></td><td>1800 × 750 × H720–750mm</td><td>Rental · black cloth on top</td></tr>
<tr><td><b>Small table</b></td><td>600 × 450 × H700mm</td><td>Product display · in front of screen</td></tr>
<tr><td><b>Screen</b></td><td>43–55 inch vertical</td><td>Base under 600 × 600mm · behind small table</td></tr>
<tr><td><b>Throw distance</b></td><td>2.2m</td><td>Shorter than beer pong (2.4m)</td></tr>
</table></div>

<h2>Fixing the back wall — the key point <span class="pill p-hot">KEY</span></h2>
<div class="note"><b>We put a 2.5m cloth outdoors on the 3rd floor. That is a sail.</b>
If wind blows it over, the booth, the products and the guests are all at risk. Decide the fixing method first.</div>
<div class="tbl-scroll"><table>
<tr><th>Item</th><th>Spec</th><th>Note</th></tr>
<tr><td><b>Backdrop stand</b></td><td>3m cross bar + 2.5m poles, adjustable</td><td>Rent or buy</td></tr>
<tr><td><b>Weights</b></td><td>4+ sand bags or water bags</td><td><b>Must have outdoors.</b> At the pole base</td></tr>
<tr><td>Wall cloth</td><td>3.0 × 2.5m · black matte</td><td>Pocket top is fastest to hang</td></tr>
<tr><td>Clamps</td><td>6–8</td><td>Hold the cloth top</td></tr>
<tr><td>Cable ties · rope</td><td>Plenty</td><td>Tie the frame, quick fixes</td></tr>
</table></div>
<p style="font-size:13.5px;color:#66666F">Ask the host if we can <b>tie the stand to a rail or a post</b>. That makes it much safer. (With the 23 Oct load-in form.)</p>

<h2>Where to put the big "정" <span class="pill p-hot">DECIDE</span></h2>
<div class="ab win"><b>Centre of the back wall — cups on top of the letter <span class="pill p-hot">best</span></b>
<div class="pro">Guests look at it the whole time they throw. It is in every photo and video</div>
<div class="pro">Cups cover a little of it, but it is one letter, so people still read it</div>
<div class="pro">Uses the full 2.5m wall. No empty space at the bottom</div>
<div class="con">We need a design that works with the cups on top</div></div>
<div class="ab"><b>Front of the table</b>
<div class="pro">Easy to make (print or stick on the cloth)</div>
<div class="con">Guests, products and gift boxes cover it all night</div>
<div class="con">Table is only 750mm high — it falls below eye level</div></div>
<div class="note"><b>Go with the back wall.</b> Make "정" 1.5m or taller, in ivory or white.
Put the 6 cups on top of it. Then the game, the brand and the photo spot all live on one wall.</div>

<h2>Making the game target</h2>
<p style="color:#66666F;font-size:14px">Cups stuck straight on the cloth will sag and shake. We need a board.</p>
<div class="tbl-scroll"><table>
<tr><th>Option</th><th>How</th><th>Call</th></tr>
<tr><td><b>A. Black paper cups + board</b></td><td>Stick 6 cups on a 1200×900mm foam board, fix the board to the wall</td><td><b>Best</b> — build it before the day</td></tr>
<tr><td>B. Printed target with holes</td><td>6 round holes in a board, pockets behind</td><td>Too hard to make in time</td></tr>
<tr><td>C. Cups on the cloth</td><td>Tape or velcro</td><td>No — they sag and fall</td></tr>
</table></div>
<div class="note"><b>We only get 1 hour to set up (16:00–17:00).</b> Stick all the cups on the board first
and bring it ready. On site we only fix the board to the wall.</div>
<ul>
<li>Fix the board: cable ties to the cross bar, or clamps on the poles</li>
<li>Cup colour: <b>black</b>. Red cups would fight with the red in "정"</li>
<li>Cup 90mm wide → bean bag 60–70mm</li>
</ul>

<h2>Screen and product display</h2>
<div class="card">
<ul>
<li>Layout: <b>screen at the back, small table in front.</b> Products go on the table</li>
<li>Small table 600 × 450 × H700mm · black cloth</li>
<li>Screen 43–55 inch vertical, base under 600 × 600mm</li>
<li class="k">700 nit or brighter — a normal TV is not visible at 17:00–18:00 outdoors</li>
<li>Must play a USB loop by itself</li>
</ul>
</div>
<h3>What to play</h3>
<ul>
<li>Our Instagram Reels (already 9:16, use as they are)</li>
<li>Product videos</li>
<li class="k">Join them into one file that <b>plays all night</b>. Cuts of 30–60 seconds</li>
<li>No sound, subtitles needed (DJ music comes up from 2F)</li>
</ul>

<h2>Costumes — 4 characters</h2>
<div class="tbl-scroll"><table>
<tr><th>Character</th><th>Key look</th><th>Colour</th></tr>
<tr><td><b>Wednesday</b></td><td>Black dress + white collar, two braids</td><td>Black · white</td></tr>
<tr><td><b>Morticia (mother)</b></td><td>Long black dress, long straight hair, pale skin</td><td>Black</td></tr>
<tr><td><b>Enid (friend)</b></td><td>Bright and cute look</td><td><b>Rainbow in the show</b></td></tr>
<tr><td>Bianca or Grandmama</td><td>Idea for the 4th</td><td>Black · navy</td></tr>
</table></div>
<div class="note"><b>Careful with Enid.</b> In the show she wears rainbow colours.
That would break our "one forbidden colour" rule.
Do a <b>black, white and silver version</b> instead — same shape, no colour.</div>

<h2>Name tags — Korean school style</h2>
<div class="card hi" data-tag="GOOD IDEA">
<p>A Korean school name tag fits Wednesday very well. Nevermore is a school.
This is better than the metal brooch we looked at before.</p>
<div class="tbl-scroll"><table>
<tr><th></th><th>School name tag</th><th>Metal brooch</th></tr>
<tr><td>Fits the theme</td><td><b>Very well (school)</b></td><td>So-so</td></tr>
<tr><td>Making time</td><td>3–5 days</td><td>2–3 weeks</td></tr>
<tr><td>Price</td><td>Low</td><td>High</td></tr>
<tr><td>Easy to read</td><td>Korean guests get it at once</td><td>Too small to read</td></tr>
</table></div>
<ul>
<li>Spec: white base, black text. Left chest</li>
<li>Text: <b>JUNG BEAUTY</b> (top) + name (below)</li>
<li>Magnet type, so no pin holes in the dress</li>
</ul>
</div>`,

`<h2>Buying and rental — all under review</h2>

<tr><td><b>Main table 1800</b></td><td>Rent</td><td><a href="https://toprent.co.kr/product/%ED%85%8C%EC%9D%B4%EB%B8%94-%EB%A0%8C%ED%83%88-%ED%96%89%EC%82%AC%EC%9A%A9-%ED%85%8C%EC%9D%B4%EB%B8%94-%EB%93%80%EB%9D%BC%ED%85%8C%EC%9D%B4%EB%B8%94-%EB%A0%8C%ED%83%88-%EB%8C%80%EC%97%AC-%EC%9E%84%EB%8C%80-1800/49/" target="_blank">Top Rent</a> · 9,000 KRW</td><td><span class="pill p-wait">Review</span></td></tr>

<h2>Supply checklist</h2>

<h2>Bean bags, not balls</h2>
<div class="note"><b>Our booth is outdoors on the 3rd floor.</b> Balls roll away and fall down the stairs.
200 guests × 3 throws = 600 throws. One staff member would spend the night picking up balls.</div>
<div class="tbl-scroll"><table>

<p style="font-size:13.5px;color:#66666F">We need only 12. Alibaba has a high minimum order. Buy in Korea.</p>

`<h2>Confirmed by the Singapore team <span class="pill p-done">CONFIRMED</span></h2>

<ul>

<h2>Door gift — 200 guests</h2>
<div class="tbl-scroll"><table>

<div class="card hi" data-tag="SHORT BY 35">
<p>Korea can make <b>65 bubble 30ml</b>, not 100. So we are <b>35 short</b>.</p>
</div>

<h3>How to fix the gap</h3>
<div class="ab win"><b>A. Ask SG for 85 instead of 50 <span class="pill p-hot">best</span></b>

<div class="ab"><b>B. Increase No Wash from 50 to 85</b>
<div class="pro">Korea stock, no lead time risk</div>

<div class="ab"><b>C. Give sachets to the last 35</b>
<div class="pro">No extra buying</div>
<div class="con">Looks cheap. People will notice</div></div>
<div class="note"><b>Try A first, then B.</b> C is the last option.</div>

<h2>Game prizes</h2>
<p style="color:#66666F;font-size:14px">Throw a bean bag into a cup on the black wall. 3 tries each.

<tr><td><b>A</b></td><td>1.8m</td><td>1</td><td><b style="color:#A80D26">Open</b> — serum if we have it</td></tr>
<tr><td><b>B</b></td><td>1.5m</td><td>2</td><td>Camellia 500ml / Shampoo</td></tr>
<tr><td><b>C</b></td><td>1.2m</td><td>3</td><td>Toner 200ml / No Wash 200ml</td></tr>

<div class="note">Write only <b>A / B / C</b> on the cups, not product names.

/* ---------- RENDER ---------- */
let lang='ko', tab=0;

function days(target){
  const t=new Date(target+'T00:00:00+09:00');
  const now=new Date();
  return Math.max(0, Math.ceil((t-now)/86400000));
}

function render(){
  const d=D[lang];
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>{
    const k=el.getAttribute('data-i'); if(d[k]!==undefined) el.textContent=d[k];
  });
  document.getElementById('d1').textContent='D-'+days('2026-08-28');
  document.getElementById('d2').textContent='D-'+days('2026-10-30');

  const nav=document.getElementById('nav');
  nav.innerHTML=d.tabs.map((t,i)=>
    `<button class="${i===tab?'on':''}" onclick="setTab(${i})">${t}</button>`).join('');

  const main=document.getElementById('main');
  main.innerHTML=d.body.map((html,i)=>
    `<section class="${i===tab?'on':''}">${html.replace('__SVG__',diagram(d.svg))}</section>`).join('');

  document.getElementById('ko').className = lang==='ko'?'on':'';
  document.getElementById('en').className = lang==='en'?'on':'';
}
function setLang(l){lang=l;render()}
function setTab(i){tab=i;render();window.scrollTo({top:0,behavior:'smooth'})}
render();
</script>
